# Cloudflare Worker that starts the Deploy workflow every 6 hours (fresh reward-sharing crawl).
# GitHub's own schedule is best-effort and almost never fired for this repo; a workflow_dispatch
# always runs. Cron-only: no public URL, nothing to call from outside.
#
#   npx wrangler deploy                      # from this folder, after `npx wrangler login`
#   npx wrangler secret put GITHUB_TOKEN     # fine-grained token: this repo, Actions read & write
name = "ark-explorer-dispatch"
main = "src/index.js"
compatibility_date = "2026-11-01"
workers_dev = false
preview_urls = false

[triggers]
crons = ["41 */6 * * *"]   # UTC: 00:41, 06:41, 12:41, 18:41

[vars]
REPO = "geopsllc/ark-explorer"
WORKFLOW = "deploy.yml"
REF = "ark-mainnet"
